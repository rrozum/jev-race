name: Check source and container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt && pip install -e '.[dev]'
      - run: pytest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jev-race:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name race-check -p 8080:8080 --read-only --tmpfs /tmp jev-race:check
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
