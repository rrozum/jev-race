services:
  race:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: jev-race:local
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  vision:
    build:
      context: ../../../jev-vision
    image: jev-vision:local
    env_file:
      - ../../../jev-vision/.env
    environment:
      VISION_ORIGIN: https://decision.rrozum.pro
      VISION_DAILY_REQUESTS: "1000"
    volumes:
      - vision_budget:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      race:
        condition: service_healthy
      vision:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  vision_budget:
